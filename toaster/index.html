<!-- Browser ko batata hai ki ye HTML5 document hai. -->
<!DOCTYPE html>
<!-- HTML document ki language English set karte hain. -->
<html lang="en">
<!-- Head ke andar page ki settings aur external files hoti hain. -->
<head>
	<!-- Characters ko correctly display karne ke liye encoding set karte hain. -->
	<meta charset="UTF-8">
	<!-- Page ko mobile aur desktop dono screens par responsive banate hain. -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- Browser tab mein page ka naam show karte hain. -->
	<title>Toaster Notification</title>
	<!-- Tailwind CSS CDN se utility classes load karte hain. -->
	<script src="https://cdn.tailwindcss.com"></script>
</head>
<!-- Body ke andar page ka visible content hota hai. -->
<body>
	<!-- JavaScript isi container ke andar toast div add karega. -->
	<div class="parent"></div>

	<!-- JavaScript file load karte hain. -->
	<!-- defer ki wajah se HTML parse hone ke baad script run hogi. -->
	<script src="script.js" defer></script>
</body>
</html>
