<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Hide Alert Banner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="alert-banner" id="alertBanner" role="alert">
            <span>Success! Your message was sent.</span>
            <button id="closeButton" type="button" aria-label="Close alert">&times;</button>
        </div>

        <button id="showButton" type="button">Show Alert</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
